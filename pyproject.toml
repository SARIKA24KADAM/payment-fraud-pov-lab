[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-fraud-pov"
version = "0.1.0"
description = "Synthetic and benchmark-based payment fraud proof-of-value analysis"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
